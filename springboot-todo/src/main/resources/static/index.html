<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskr — TODO App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #16161a;
      --surface2:  #1e1e24;
      --border:    #2a2a35;
      --accent:    #c8f542;
      --accent2:   #42c8f5;
      --danger:    #f55b42;
      --warn:      #f5a742;
      --text:      #e8e8f0;
      --muted:     #6b6b80;
      --radius:    12px;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-head);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(13,13,15,.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .logo span { color: var(--accent); }

    .header-stats {
      display: flex;
      gap: 24px;
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--muted);
    }
    .stat strong { color: var(--text); font-size: .95rem; }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 40px;
    }

    /* ── Sidebar ── */
    aside {
      padding-right: 32px;
      border-right: 1px solid var(--border);
    }

    .panel-title {
      font-size: .65rem;
      font-family: var(--font-mono);
      letter-spacing: .15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 28px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: .85rem;
      padding: 11px 14px 11px 38px;
      outline: none;
      transition: border .2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .filter-group { margin-bottom: 28px; }
    .filter-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-head);
      font-size: .9rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      text-align: left;
    }
    .filter-btn:hover { background: var(--surface); color: var(--text); }
    .filter-btn.active { background: var(--surface2); color: var(--accent); }
    .filter-btn .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-all    { background: var(--text); }
    .dot-active { background: var(--accent2); }
    .dot-done   { background: var(--accent); }

    .priority-section { margin-bottom: 28px; }
    .p-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: .75rem;
      font-family: var(--font-mono);
      cursor: pointer;
      border: 1px solid transparent;
      margin: 3px 3px 3px 0;
      transition: all .15s;
    }
    .p-chip:hover { opacity: .85; }
    .p-chip.active { border-color: currentColor; }
    .chip-high   { background: rgba(245,91,66,.15);  color: var(--danger); }
    .chip-medium { background: rgba(245,167,66,.15); color: var(--warn); }
    .chip-low    { background: rgba(66,200,245,.15); color: var(--accent2); }

    /* ── Add Form ── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }

    .form-row { margin-bottom: 12px; }
    .form-row label {
      display: block;
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: .06em;
    }
    .form-row input,
    .form-row textarea,
    .form-row select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: .85rem;
      padding: 9px 12px;
      outline: none;
      resize: vertical;
      transition: border .2s;
    }
    .form-row input:focus,
    .form-row textarea:focus,
    .form-row select:focus { border-color: var(--accent); }
    .form-row textarea { min-height: 70px; }
    .form-row select option { background: var(--surface2); }

    .btn-add {
      width: 100%;
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: 8px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: .9rem;
      padding: 11px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn-add:hover { opacity: .9; }
    .btn-add:active { transform: scale(.98); }

    /* ── Main content ── */
    main { padding-left: 32px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .results-info {
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--muted);
    }

    /* ── Todo List ── */
    #todo-list { display: flex; flex-direction: column; gap: 10px; }

    .todo-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: border-color .2s, transform .15s;
      animation: slideIn .2s ease;
    }
    .todo-card:hover { border-color: #3a3a48; transform: translateY(-1px); }
    .todo-card.completed { opacity: .5; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Custom checkbox */
    .check-wrap { padding-top: 2px; }
    .check-wrap input[type=checkbox] { display: none; }
    .check-box {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
    }
    .check-box:hover { border-color: var(--accent); }
    .check-box.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .check-box.checked::after {
      content: '';
      width: 5px; height: 9px;
      border: 2px solid #0d0d0f;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      display: block;
    }

    .todo-body {}
    .todo-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .todo-card.completed .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .todo-desc {
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .todo-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: .65rem;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-high   { background: rgba(245,91,66,.18);  color: var(--danger); }
    .badge-medium { background: rgba(245,167,66,.18); color: var(--warn); }
    .badge-low    { background: rgba(66,200,245,.18); color: var(--accent2); }
    .badge-date   { background: var(--surface2); color: var(--muted); }

    .todo-actions {
      display: flex;
      gap: 4px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
    }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .icon-btn.del:hover { color: var(--danger); }

    /* ── Edit Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 480px;
      max-width: calc(100vw - 32px);
      transform: scale(.95) translateY(10px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 1.15rem; font-weight: 700; }
    .modal-close {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 1.2rem; line-height: 1;
      padding: 4px; border-radius: 4px;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .btn-save {
      background: var(--accent2);
      color: #0d0d0f;
      border: none;
      border-radius: 8px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: .9rem;
      padding: 11px 24px;
      cursor: pointer;
      transition: opacity .15s;
      margin-top: 4px;
    }
    .btn-save:hover { opacity: .9; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .big { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-family: var(--font-mono); font-size: .85rem; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: var(--font-mono);
      font-size: .8rem;
      color: var(--text);
      z-index: 999;
      transform: translateY(20px);
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--accent); color: var(--accent); }
    .toast.error   { border-color: var(--danger); color: var(--danger); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">task<span>r</span></div>
  <div class="header-stats">
    <div class="stat"><strong id="stat-total">0</strong><br>total</div>
    <div class="stat"><strong id="stat-active">0</strong><br>active</div>
    <div class="stat"><strong id="stat-done">0</strong><br>done</div>
  </div>
</header>

<div class="app">

  <!-- Sidebar -->
  <aside>

    <!-- Search -->
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search tasks…" />
    </div>

    <!-- Status filter -->
    <div class="filter-group">
      <div class="panel-title">Status</div>
      <button class="filter-btn active" data-filter="all">
        <span class="dot dot-all"></span> All tasks
      </button>
      <button class="filter-btn" data-filter="active">
        <span class="dot dot-active"></span> Active
      </button>
      <button class="filter-btn" data-filter="done">
        <span class="dot dot-done"></span> Completed
      </button>
    </div>

    <!-- Priority filter -->
    <div class="priority-section">
      <div class="panel-title">Priority</div>
      <span class="p-chip chip-high"  data-priority="HIGH">▲ High</span>
      <span class="p-chip chip-medium" data-priority="MEDIUM">● Med</span>
      <span class="p-chip chip-low"   data-priority="LOW">▼ Low</span>
    </div>

    <!-- Add Task Form -->
    <div class="add-form">
      <div class="panel-title" style="margin-bottom:16px">New Task</div>
      <div class="form-row">
        <label>TITLE *</label>
        <input type="text" id="new-title" placeholder="What needs to be done?" />
      </div>
      <div class="form-row">
        <label>DESCRIPTION</label>
        <textarea id="new-desc" placeholder="Optional details…"></textarea>
      </div>
      <div class="form-row">
        <label>PRIORITY</label>
        <select id="new-priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="HIGH">High</option>
        </select>
      </div>
      <button class="btn-add" id="btn-add">＋ Add Task</button>
    </div>

  </aside>

  <!-- Main list -->
  <main>
    <div class="toolbar">
      <div class="results-info" id="results-info">Loading…</div>
    </div>
    <div id="todo-list"></div>
  </main>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit Task</h2>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="form-row">
      <label>TITLE *</label>
      <input type="text" id="edit-title" />
    </div>
    <div class="form-row">
      <label>DESCRIPTION</label>
      <textarea id="edit-desc"></textarea>
    </div>
    <div class="form-row">
      <label>PRIORITY</label>
      <select id="edit-priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>
    </div>
    <div class="form-row">
      <label>STATUS</label>
      <select id="edit-completed">
        <option value="false">Active</option>
        <option value="true">Completed</option>
      </select>
    </div>
    <button class="btn-save" id="btn-save">Save Changes</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api/todos';
  let todos = [];
  let currentFilter = 'all';
  let priorityFilter = null;
  let editingId = null;
  let searchDebounce = null;

  // ── Utilities ──────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function fmt(dt) {
    if (!dt) return '';
    const d = new Date(dt);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }
  function toast(msg, type = 'success') {
    const t = $('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = 'toast', 2400);
  }

  // ── API helpers ────────────────────────────────────────────────────
  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Request failed' }));
      throw new Error(err.error || 'Request failed');
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  // ── Fetch & Render ─────────────────────────────────────────────────
  async function loadTodos(search = '') {
    try {
      let url = '';
      if (search) url = `?search=${encodeURIComponent(search)}`;
      else if (currentFilter === 'active') url = '?completed=false';
      else if (currentFilter === 'done')   url = '?completed=true';
      todos = await api(url);
      render();
    } catch (e) {
      toast('Failed to load todos', 'error');
    }
  }

  function render() {
    let list = todos;
    if (priorityFilter) list = list.filter(t => t.priority === priorityFilter);

    // stats over full list (no priority filter for accuracy)
    $('stat-total').textContent  = todos.length;
    $('stat-active').textContent = todos.filter(t => !t.completed).length;
    $('stat-done').textContent   = todos.filter(t =>  t.completed).length;
    $('results-info').textContent = `${list.length} task${list.length !== 1 ? 's' : ''}`;

    const el = $('todo-list');
    if (!list.length) {
      el.innerHTML = `<div class="empty-state"><div class="big">✦</div><p>No tasks found.</p></div>`;
      return;
    }
    el.innerHTML = list.map(t => `
      <div class="todo-card ${t.completed ? 'completed' : ''}" data-id="${t.id}">
        <div class="check-wrap">
          <div class="check-box ${t.completed ? 'checked' : ''}" data-id="${t.id}" onclick="toggleTodo(${t.id})"></div>
        </div>
        <div class="todo-body">
          <div class="todo-title">${esc(t.title)}</div>
          ${t.description ? `<div class="todo-desc">${esc(t.description)}</div>` : ''}
          <div class="todo-meta">
            <span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span>
            <span class="badge badge-date">${fmt(t.createdAt)}</span>
          </div>
        </div>
        <div class="todo-actions">
          <button class="icon-btn" title="Edit" onclick="openEdit(${t.id})">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn del" title="Delete" onclick="deleteTodo(${t.id})">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── CRUD ───────────────────────────────────────────────────────────
  async function addTodo() {
    const title = $('new-title').value.trim();
    if (!title) { toast('Title is required', 'error'); return; }
    try {
      await api('', { method: 'POST', body: JSON.stringify({
        title,
        description: $('new-desc').value.trim(),
        priority: $('new-priority').value,
        completed: false
      })});
      $('new-title').value = '';
      $('new-desc').value = '';
      $('new-priority').value = 'MEDIUM';
      toast('Task added ✓');
      loadTodos();
    } catch(e) { toast(e.message, 'error'); }
  }

  async function toggleTodo(id) {
    try {
      await api(`/${id}/toggle`, { method: 'PATCH' });
      loadTodos();
    } catch(e) { toast(e.message, 'error'); }
  }

  async function deleteTodo(id) {
    try {
      await api(`/${id}`, { method: 'DELETE' });
      toast('Task deleted');
      loadTodos();
    } catch(e) { toast(e.message, 'error'); }
  }

  function openEdit(id) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    $('edit-title').value     = t.title;
    $('edit-desc').value      = t.description || '';
    $('edit-priority').value  = t.priority;
    $('edit-completed').value = String(t.completed);
    $('modal').classList.add('open');
  }

  async function saveEdit() {
    const title = $('edit-title').value.trim();
    if (!title) { toast('Title required', 'error'); return; }
    try {
      await api(`/${editingId}`, { method: 'PUT', body: JSON.stringify({
        title,
        description: $('edit-desc').value.trim(),
        priority:    $('edit-priority').value,
        completed:   $('edit-completed').value === 'true'
      })});
      $('modal').classList.remove('open');
      toast('Task updated ✓');
      loadTodos();
    } catch(e) { toast(e.message, 'error'); }
  }

  // ── Events ─────────────────────────────────────────────────────────
  $('btn-add').addEventListener('click', addTodo);
  $('new-title').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  $('btn-save').addEventListener('click', saveEdit);
  $('modal-close').addEventListener('click', () => $('modal').classList.remove('open'));
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.remove('open'); });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      $('search-input').value = '';
      loadTodos();
    });
  });

  document.querySelectorAll('.p-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const p = chip.dataset.priority;
      if (priorityFilter === p) {
        priorityFilter = null;
        chip.classList.remove('active');
      } else {
        document.querySelectorAll('.p-chip').forEach(c => c.classList.remove('active'));
        priorityFilter = p;
        chip.classList.add('active');
      }
      render();
    });
  });

  $('search-input').addEventListener('input', e => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => loadTodos(e.target.value.trim()), 300);
  });

  // ── Init ───────────────────────────────────────────────────────────
  loadTodos();
</script>
</body>
</html>
